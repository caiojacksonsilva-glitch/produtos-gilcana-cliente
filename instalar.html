<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#064f3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Instalar Produtos Gilçana</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-180.png"><link rel="stylesheet" href="style.css?v=410"></head>
<body><main class="install-guide"><div class="install-brand"><img src="assets/icon-192.png" alt="Produtos Gilçana"><h1>Produtos Gilçana</h1><p>Instale nosso aplicativo de pedidos</p></div><div class="card"><button id="installNow" class="primary install-main-btn">Instalar aplicativo</button><div id="installed" class="install-note" hidden>O aplicativo já está instalado neste aparelho. Você pode abri-lo pelo ícone na tela inicial.</div><div id="steps" class="install-steps"></div></div><a class="install-back" href="./">Abrir Produtos Gilçana</a></main>
<script>
let promptInstall=null;
const btn=document.getElementById('installNow'),steps=document.getElementById('steps'),installed=document.getElementById('installed');
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const android=/android/i.test(navigator.userAgent);const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function row(n,t,d){return `<div class="install-step"><span class="step-number">${n}</span><div><b>${t}</b><p>${d}</p></div></div>`}
function draw(){if(standalone){btn.hidden=true;installed.hidden=false;steps.innerHTML='';return}if(ios){btn.textContent='Ver como instalar no iPhone';steps.innerHTML=row(1,'Abra no Safari','Se recebeu este link em outro aplicativo, abra esta página no Safari.')+row(2,'Toque em Compartilhar','Use o botão de compartilhar do Safari.')+row(3,'Adicionar à Tela de Início','Role as opções e toque em “Adicionar à Tela de Início”.')+row(4,'Toque em Adicionar','O ícone Produtos Gilçana aparecerá na sua tela inicial.');return}if(android){btn.textContent=promptInstall?'Instalar aplicativo':'Como instalar no Android';steps.innerHTML=row(1,'Abra no Chrome','Use o Google Chrome para abrir esta página.')+row(2,'Toque em Instalar aplicativo','Se o botão de instalação aparecer, confirme a instalação.')+row(3,'Se o botão não aparecer','Abra o menu ⋮ do Chrome e escolha “Instalar app” ou “Adicionar à tela inicial”.');return}btn.textContent='Como instalar';steps.innerHTML=row(1,'Abra no navegador do celular','Use o navegador principal do seu aparelho.')+row(2,'Abra o menu do navegador','Procure “Instalar app” ou “Adicionar à tela inicial”.')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstall=e;draw()});window.addEventListener('appinstalled',()=>{promptInstall=null;btn.hidden=true;installed.hidden=false;steps.innerHTML='' });
btn.addEventListener('click',async()=>{if(promptInstall){promptInstall.prompt();await promptInstall.userChoice;promptInstall=null;draw();return}if(ios){steps.scrollIntoView({behavior:'smooth',block:'center'});return}steps.scrollIntoView({behavior:'smooth',block:'center'})});draw();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}));
</script></body></html>
